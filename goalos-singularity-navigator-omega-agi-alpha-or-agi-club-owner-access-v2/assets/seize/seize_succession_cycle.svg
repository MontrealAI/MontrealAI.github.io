<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">SEIZE Succession Underwriting Cycle</title>
<desc id="desc">Five stages: Surface, Evaluate, Instantiate, Zero in and Elevate.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06152B"/><stop offset="1" stop-color="#101E37"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D6AA42"/></marker></defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="35" y="35" width="1530" height="830" rx="28" fill="none" stroke="#D6AA42" stroke-width="3"/>
<text x="80" y="110" fill="#F4E6B9" font-family="Georgia,serif" font-size="64" font-weight="700">SEIZE</text><text x="80" y="160" fill="#FFFFFF" font-family="Georgia,serif" font-size="40" font-weight="700">The Succession Underwriting Microcycle</text>
<g font-family="Arial,sans-serif">
<g transform="translate(95,240)"><circle cx="130" cy="130" r="115" fill="#FBF7EE" stroke="#D6AA42" stroke-width="4"/><text x="130" y="95" text-anchor="middle" fill="#06152B" font-size="64" font-weight="700">S</text><text x="130" y="135" text-anchor="middle" fill="#0D6848" font-size="25" font-weight="700">Surface</text><text x="130" y="172" text-anchor="middle" fill="#17231D" font-size="18">the succession event</text></g>
<g transform="translate(390,240)"><circle cx="130" cy="130" r="115" fill="#FBF7EE" stroke="#D6AA42" stroke-width="4"/><text x="130" y="95" text-anchor="middle" fill="#06152B" font-size="64" font-weight="700">E</text><text x="130" y="135" text-anchor="middle" fill="#0D6848" font-size="25" font-weight="700">Evaluate</text><text x="130" y="172" text-anchor="middle" fill="#17231D" font-size="18">the successor frontier</text></g>
<g transform="translate(685,240)"><circle cx="130" cy="130" r="115" fill="#FBF7EE" stroke="#D6AA42" stroke-width="4"/><text x="130" y="95" text-anchor="middle" fill="#06152B" font-size="64" font-weight="700">I</text><text x="130" y="135" text-anchor="middle" fill="#0D6848" font-size="25" font-weight="700">Instantiate</text><text x="130" y="172" text-anchor="middle" fill="#17231D" font-size="18">the succession constitution</text></g>
<g transform="translate(980,240)"><circle cx="130" cy="130" r="115" fill="#FBF7EE" stroke="#D6AA42" stroke-width="4"/><text x="130" y="95" text-anchor="middle" fill="#06152B" font-size="64" font-weight="700">Z</text><text x="130" y="135" text-anchor="middle" fill="#0D6848" font-size="25" font-weight="700">Zero in</text><text x="130" y="172" text-anchor="middle" fill="#17231D" font-size="18">on decisive proof</text></g>
<g transform="translate(1275,240)"><circle cx="130" cy="130" r="115" fill="#FBF7EE" stroke="#D6AA42" stroke-width="4"/><text x="130" y="95" text-anchor="middle" fill="#06152B" font-size="64" font-weight="700">E</text><text x="130" y="135" text-anchor="middle" fill="#0D6848" font-size="25" font-weight="700">Elevate</text><text x="130" y="172" text-anchor="middle" fill="#17231D" font-size="18">one frozen challenger</text></g>
</g>
<g stroke="#D6AA42" stroke-width="6" marker-end="url(#a)"><line x1="340" y1="370" x2="392" y2="370"/><line x1="635" y1="370" x2="687" y2="370"/><line x1="930" y1="370" x2="982" y2="370"/><line x1="1225" y1="370" x2="1277" y2="370"/></g>
<rect x="180" y="600" width="1240" height="145" rx="24" fill="#F5E3E0" stroke="#973838" stroke-width="3"/><text x="800" y="650" text-anchor="middle" fill="#973838" font-family="Arial,sans-serif" font-size="30" font-weight="700">SEIZE ends at the Promotion Request.</text><text x="800" y="698" text-anchor="middle" fill="#17231D" font-family="Arial,sans-serif" font-size="22">The challenger cannot control protected evaluation, certify itself, hold release credentials, install itself or expand authority.</text>
<text x="800" y="820" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="25" font-weight="700">Underwrite succession. Purchase reality. Elevate only what can be independently proven.</text>
</svg>
