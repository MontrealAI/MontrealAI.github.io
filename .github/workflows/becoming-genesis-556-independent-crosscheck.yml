name: MONTREAL.AI Genesis 556 Independent Crosscheck

on:
  push:
    branches:
      - snapshot/becoming-genesis-556-20260816
    paths:
      - .github/workflows/becoming-genesis-556-independent-crosscheck.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and download complete snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check requests
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/MontrealAI/MontrealAI.github.io/actions/artifacts/9258453781/zip" \
            -o complete_snapshot.zip
          mkdir -p complete_snapshot
          unzip -q complete_snapshot.zip -d complete_snapshot
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/MontrealAI/MontrealAI.github.io/7b5aca562eb51d89701257d821195438f312bd1f/tools/becoming_snapshot/snapshot_v5_focus.py \
            -o snapshot_v5_focus.py
      - name: Re-read all 556 balances independently
        env:
          ETH_RPC_URLS: "https://eth.llamarpc.com,https://ethereum-rpc.publicnode.com,https://rpc.flashbots.net,https://eth.drpc.org"
          HTTP_TIMEOUT: "45"
        run: |
          mkdir -p crosscheck_output
          cat > crosscheck.py <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          import snapshot_v5_focus as s
          base=Path('complete_snapshot');out=Path('crosscheck_output')
          status=json.loads((base/'snapshot/snapshot_status.json').read_text())
          block=int(status['block_number']); expected_hash=status['block_hash'].lower()
          with (base/'snapshot/token_holdings.csv').open(encoding='utf-8',newline='') as f: holdings=list(csv.DictReader(f))
          candidates={r['token_id_decimal']:{r['holder_address'].lower()} for r in holdings}
          queried,attempts=s.query(candidates,hex(block))
          by={(r['token_id_decimal'],r['holder_address']):int(r['balance']) for r in queried}
          rows=[]
          for r in holdings:
              value=by.get((r['token_id_decimal'],r['holder_address'].lower()),-1)
              rows.append({'canonical_number':r['canonical_number'],'token_id_decimal':r['token_id_decimal'],'holder_address':r['holder_address'].lower(),'expected_balance':r['balance'],'crosscheck_balance':value,'status':'PASS' if value==int(r['balance'])==1 else 'FAIL'})
          block_checks=[]
          for u in s.RPC_URLS:
              try:
                  b=s.rpc_one(u,'eth_getBlockByNumber',[hex(block),False],2);h=str((b or {}).get('hash','')).lower();block_checks.append({'rpc_endpoint':u,'reported_hash':h,'status':'PASS' if h==expected_hash else 'MISMATCH'})
              except Exception as e:block_checks.append({'rpc_endpoint':u,'status':'ERROR','error':str(e)})
          with (out/'all_556_balance_crosscheck.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          summary={'schema':'montrealai.becoming.independent-balance-crosscheck.v1','block_number':block,'expected_block_hash':expected_hash,'rows':len(rows),'passed':sum(r['status']=='PASS' for r in rows),'failed':sum(r['status']!='PASS' for r in rows),'verified_units':sum(r['crosscheck_balance'] for r in rows if isinstance(r['crosscheck_balance'],int) and r['crosscheck_balance']>=0),'block_checks':block_checks,'rpc_attempts':attempts,'complete':len(rows)==556 and all(r['status']=='PASS' for r in rows)}
          (out/'independent_crosscheck.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          raise SystemExit(0 if summary['complete'] else 2)
          PY
          python crosscheck.py
      - uses: actions/upload-artifact@v4
        with:
          name: montrealai-becoming-genesis-556-independent-crosscheck
          path: crosscheck_output
          if-no-files-found: error
          retention-days: 7
