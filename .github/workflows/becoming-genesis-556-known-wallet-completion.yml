name: MONTREAL.AI Genesis 556 Known-Wallet Completion

on:
  push:
    branches:
      - snapshot/becoming-genesis-556-20260816
    paths:
      - .github/workflows/becoming-genesis-556-known-wallet-completion.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout focused resolver only
        uses: actions/checkout@v4
        with:
          ref: snapshot/becoming-genesis-556-20260816
          sparse-checkout: |
            tools/becoming_snapshot/snapshot_v5_focus.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency and audited base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check requests
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/MontrealAI/MontrealAI.github.io/actions/artifacts/9257733523/zip" \
            -o base_snapshot.zip
          mkdir -p base_snapshot
          unzip -q base_snapshot.zip -d base_snapshot
          cp tools/becoming_snapshot/snapshot_v5_focus.py snapshot_v5_focus.py
          python -m py_compile snapshot_v5_focus.py
          test -f base_snapshot/snapshot/token_holdings.csv
          test -f base_snapshot/snapshot/snapshot_block.json
      - name: Test every proven Genesis-holder wallet at the frozen block
        id: capture
        continue-on-error: true
        env:
          BASE_SNAPSHOT: base_snapshot
          SNAPSHOT_OUT: snapshot_output
          HTTP_RETRIES: "3"
          HTTP_TIMEOUT: "45"
          ETH_RPC_URLS: "https://rpc.flashbots.net,https://eth.drpc.org,https://ethereum-rpc.publicnode.com,https://eth.llamarpc.com"
        run: |
          cat > known_wallet_runner.py <<'PY'
          import csv
          import snapshot_v5_focus as s
          def known_wallet_discover(target,end_block):
              with (s.BASE/'snapshot/wallet_summary.csv').open(encoding='utf-8',newline='') as f:
                  addresses={r['holder_address'].lower() for r in csv.DictReader(f)}
              addresses.update({s.CREATOR,s.DEAD})
              print(f'Known-wallet universe: {len(addresses)} addresses × {len(target)} target IDs',flush=True)
              return {tid:set(addresses) for tid in target},[],[]
          s.discover=known_wallet_discover
          raise SystemExit(s.main())
          PY
          python known_wallet_runner.py
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montrealai-becoming-genesis-556-known-wallet-completion
          path: snapshot_output
          if-no-files-found: error
          retention-days: 7
      - name: Enforce strict completion
        if: steps.capture.outcome != 'success'
        run: exit 1
