name: Becoming Omega Genesis Snapshot

on:
  push:
    branches:
      - snapshot/becoming-omega-2026-08-15
    paths:
      - tools/becoming_omega_snapshot.py
      - .github/workflows/becoming-omega-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out isolated snapshot branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and verify snapshot
        env:
          SNAPSHOT_OUT: snapshot_output
        run: python tools/becoming_omega_snapshot.py
      - name: Upload complete snapshot package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MONTREALAI-BECOMING-OMEGA-GENESIS-SNAPSHOT
          path: snapshot_output/
          if-no-files-found: error
          retention-days: 7
