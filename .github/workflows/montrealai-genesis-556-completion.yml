name: MONTREAL.AI Genesis 556 Onchain Completion Verification

on:
  push:
    branches:
      - research/montrealai-genesis-556-completion-20260816
    paths:
      - .github/workflows/montrealai-genesis-556-completion.yml
      - tools/montrealai_provenance/verify_genesis_556_completion.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/montrealai-genesis-556-completion-20260816
          sparse-checkout: |
            tools/montrealai_provenance/verify_genesis_556_completion.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download preserved definitive baseline state
        uses: actions/download-artifact@v4
        with:
          name: montrealai-current-state-independent-crosscheck
          path: baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: MontrealAI/MontrealAI.github.io
          run-id: 31954525558
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check requests eth-abi eth-utils "eth-hash[pycryptodome]"
      - name: Verify Genesis 556 completion at a finalized Ethereum block
        id: verify
        continue-on-error: true
        env:
          OUTPUT_DIR: genesis_556_completion_verification
          BASELINE_CSV: baseline/crosscheck_rows.csv
          ETH_RPC_URLS: https://rpc.mevblocker.io,https://ethereum.publicnode.com,https://1rpc.io/eth,https://eth.llamarpc.com,https://eth.drpc.org
          HTTP_TIMEOUT: "45"
          LOG_CHUNK: "250"
          BALANCE_CHUNK: "25"
        run: python tools/montrealai_provenance/verify_genesis_556_completion.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montrealai-genesis-556-onchain-completion-verification
          path: genesis_556_completion_verification
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Enforce verification acceptance
        if: steps.verify.outcome != 'success'
        run: exit 1
