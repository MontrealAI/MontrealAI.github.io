name: MONTREAL.AI Genesis 556 Focused Completion

on:
  push:
    branches:
      - snapshot/becoming-genesis-556-20260816
    paths:
      - .github/workflows/becoming-genesis-556-snapshot-v5.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Download the audited 548-row base artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/MontrealAI/MontrealAI.github.io/actions/artifacts/9257733523/zip" \
            -o base_snapshot.zip
          mkdir -p base_snapshot
          unzip -q base_snapshot.zip -d base_snapshot
          test -f base_snapshot/snapshot/token_holdings.csv
          test -f base_snapshot/snapshot/snapshot_block.json
      - name: Download immutable focused resolver
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/MontrealAI/MontrealAI.github.io/7b5aca562eb51d89701257d821195438f312bd1f/tools/becoming_snapshot/snapshot_v5_focus.py \
            -o snapshot_v5_focus.py
          python -m py_compile snapshot_v5_focus.py
      - name: Resolve the eight missing IDs and complete the frozen-block ledger
        id: capture
        continue-on-error: true
        env:
          BASE_SNAPSHOT: base_snapshot
          SNAPSHOT_OUT: snapshot_output
          HTTP_RETRIES: "6"
          HTTP_TIMEOUT: "45"
          ETH_RPC_URLS: "https://eth.llamarpc.com,https://rpc.flashbots.net,https://eth.drpc.org,https://ethereum-rpc.publicnode.com"
        run: python snapshot_v5_focus.py
      - name: Preserve evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montrealai-becoming-genesis-556-complete-snapshot
          path: snapshot_output
          if-no-files-found: error
          retention-days: 7
      - name: Enforce strict completion
        if: steps.capture.outcome != 'success'
        run: exit 1
