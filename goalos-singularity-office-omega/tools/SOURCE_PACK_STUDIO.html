<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoalOS Source Pack Studio</title><style>body{margin:0;background:#050811;color:#eee6d7;font:15px/1.5 system-ui}main{max-width:1050px;margin:auto;padding:40px}h1{font:700 48px Georgia;color:#efc971}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}section{border:1px solid #755c2d;border-radius:18px;background:#0c1424;padding:20px}input,textarea,button{width:100%;margin:7px 0;padding:11px;border-radius:9px;border:1px solid #755c2d;background:#080e1b;color:#eee}button{background:#efc971;color:#111;font-weight:900;cursor:pointer}textarea{min-height:220px}.warn{border-left:4px solid #efc971;padding:12px;background:#efc97113}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><main><h1>GoalOS Source Pack Studio Ω</h1><p class="warn">Publisher-only local tool. Import the private publisher JWK from the separately preserved Publisher Vault. Never deploy the private key to GitHub Pages.</p><div class="grid"><section><input type="file" id="key"><input id="packId" value="frontier-pack-custom"><textarea id="sources" placeholder='[{"id":"source-1","title":"…","authority":"…","url":"https://…","verifiedAt":"2026-07-26","domains":["security"],"implication":"…"}]'></textarea><button id="sign">Sign source pack</button></section><section><textarea id="out" readonly></textarea><button id="download">Download JSON</button></section></div></main><script>let jwk=null,result=null;const enc=new TextEncoder();function canonical(o){if(o===null||typeof o!=='object')return JSON.stringify(o);if(Array.isArray(o))return'['+o.map(canonical).join(',')+']';return'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canonical(o[k])).join(',')+'}'}function b64u(b){let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}key.onchange=async()=>jwk=JSON.parse(await key.files[0].text());sign.onclick=async()=>{try{if(!jwk)throw Error('Import private JWK');const payload={schema:'goalos.source-pack.v1',product:'GoalOS Singularity Office Ω',release:'v2.0.0-SO2',packId:packId.value.trim(),issuedAt:new Date().toISOString(),sources:JSON.parse(sources.value)};const k=await crypto.subtle.importKey('jwk',jwk,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);const sig=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},k,enc.encode(canonical(payload)));result={...payload,signatureAlgorithm:'ECDSA-P256-SHA256',publicKeyId:'goalos-office-publisher-2026-01',signature:b64u(sig)};out.value=JSON.stringify(result,null,2)}catch(e){alert(e.message)}};download.onclick=()=>{if(!result)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));a.download=result.packId+'.json';a.click()};</script></html>
