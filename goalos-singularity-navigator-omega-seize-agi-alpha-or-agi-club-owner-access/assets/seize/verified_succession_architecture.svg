<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">GoalOS Verified Succession Institution Architecture</title>
<desc id="desc">Five-plane architecture from public navigation through protected formation, independent proof, Chronicle and capital allocation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06152B"/><stop offset="1" stop-color="#0B203A"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.28"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D6AA42"/></marker>
</defs>
<rect width="1600" height="980" fill="url(#bg)"/>
<rect x="35" y="35" width="1530" height="910" rx="28" fill="none" stroke="#D6AA42" stroke-width="3"/>
<text x="90" y="105" fill="#F4E6B9" font-family="Georgia,serif" font-size="46" font-weight="700">GoalOS + SEIZE</text>
<text x="90" y="157" fill="#FFFFFF" font-family="Georgia,serif" font-size="56" font-weight="700">The Verified Succession Institution</text>
<text x="90" y="202" fill="#D6AA42" font-family="Arial,sans-serif" font-size="25">The frontier creates candidates. GoalOS constitutes successors.</text>
<g font-family="Arial,sans-serif" filter="url(#shadow)">
  <g transform="translate(150,260)"><rect width="1300" height="105" rx="22" fill="#FBF7EE" stroke="#D6AA42" stroke-width="3"/><text x="35" y="43" fill="#06152B" font-size="28" font-weight="700">1. Public / AGI Club Navigator</text><text x="35" y="78" fill="#17231D" font-size="22">Frontier sensing, Capability Twin, scenario analysis, public-safe succession qualification</text></g>
  <g transform="translate(150,395)"><rect width="1300" height="105" rx="22" fill="#FBF7EE" stroke="#D6AA42" stroke-width="3"/><text x="35" y="43" fill="#06152B" font-size="28" font-weight="700">2. Protected Opportunity Workspace</text><text x="35" y="78" fill="#17231D" font-size="22">Confidential mission, incumbent ledger, rights, economics, Succession Constitution, proof capital</text></g>
  <g transform="translate(150,530)"><rect width="1300" height="105" rx="22" fill="#FBF7EE" stroke="#D6AA42" stroke-width="3"/><text x="35" y="43" fill="#06152B" font-size="28" font-weight="700">3. Isolated Successor Foundry</text><text x="35" y="78" fill="#17231D" font-size="22">Environments, search, models, agents, tools, simulators, candidate formation, sandbox execution</text></g>
  <g transform="translate(150,665)"><rect width="1300" height="105" rx="22" fill="#FBF7EE" stroke="#D6AA42" stroke-width="3"/><text x="35" y="43" fill="#06152B" font-size="28" font-weight="700">4. Independent Proof Plane</text><text x="35" y="78" fill="#17231D" font-size="22">Protected cases, scorer internals, Fresh-Successor Gate, canary evidence, human release</text></g>
  <g transform="translate(150,800)"><rect width="1300" height="105" rx="22" fill="#FBF7EE" stroke="#D6AA42" stroke-width="3"/><text x="35" y="43" fill="#06152B" font-size="28" font-weight="700">5. Chronicle + Capital Plane</text><text x="35" y="78" fill="#17231D" font-size="22">Admission, Succession Ledger, realized value, impairment, requalification, Capital-to-Capacity</text></g>
</g>
<g stroke="#D6AA42" stroke-width="5" marker-end="url(#arrow)"><line x1="800" y1="365" x2="800" y2="392"/><line x1="800" y1="500" x2="800" y2="527"/><line x1="800" y1="635" x2="800" y2="662"/><line x1="800" y1="770" x2="800" y2="797"/></g>
<text x="800" y="940" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="22" font-weight="700">Only verified successors inherit authority.</text>
</svg>
