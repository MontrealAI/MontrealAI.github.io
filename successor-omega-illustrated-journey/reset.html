<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Successor Ω — Refresh Access Edition</title><style>body{font-family:system-ui;background:#07172c;color:#fbf7ee;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:680px;background:#fbf7ee;color:#07172c;border:2px solid #c79a2b;border-radius:20px;padding:34px;box-shadow:0 24px 80px #0008}h1{font-family:Georgia,serif}button{background:#07172c;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:700}#status{margin:18px 0}</style></head><body><main class="card"><h1>Successor Ω — Refresh the Access Edition</h1><p>This utility removes the previous cached service worker and loads the corrected direct-wallet edition.</p><p id="status">Preparing refresh…</p><button id="again" hidden>Return to the publication</button></main><script>(async()=>{const s=document.querySelector('#status'),b=document.querySelector('#again');try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}sessionStorage.clear();s.textContent='Cache cleared. Returning to the corrected publication…';setTimeout(()=>location.replace('./?access=v1.0.2&refresh='+Date.now()),900)}catch(e){s.textContent='Automatic refresh could not finish. Select the button below.';b.hidden=false;b.onclick=()=>location.replace('./?access=v1.0.2&refresh='+Date.now())}})()</script></body></html>
