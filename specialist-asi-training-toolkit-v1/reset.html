<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Reset GoalOS v9</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07172d;color:#fbf7ee;font:16px/1.55 Arial,sans-serif}.card{width:min(680px,calc(100% - 40px));background:#fbf7ee;color:#07172d;border:2px solid #c79a2b;border-radius:20px;padding:34px;box-shadow:0 30px 80px #0008}h1{font:700 38px Georgia,serif;margin:.2em 0}.status{padding:14px;border-left:5px solid #c79a2b;background:#fff;margin:20px 0}a{display:inline-block;background:#07172d;color:#fff;padding:11px 16px;border-radius:8px;text-decoration:none;font-weight:700}</style></head><body><main class="card"><small>MONTREAL.AI · QUEBEC.AI</small><h1>Reset GoalOS v9</h1><p>This one-time maintenance page removes stale GoalOS caches, service workers and local access/session records before returning to the current release.</p><div id="status" class="status">Resetting…</div><a id="return" href="./" hidden>Return to GoalOS v9</a></main><script>(async()=>{const out=[];try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations()){await r.unregister();out.push('service worker')}}}catch(e){out.push('service-worker warning')}try{for(const k of await caches.keys()){await caches.delete(k);out.push('cache '+k)}}catch(e){out.push('cache warning')}try{sessionStorage.clear();for(const k of Object.keys(localStorage)){if(k.startsWith('goalos_'))localStorage.removeItem(k)}out.push('local state')}catch(e){out.push('state warning')}document.getElementById('status').textContent='Reset complete: '+out.join(', ')+'.';document.getElementById('return').hidden=false;setTimeout(()=>location.replace('./?reset='+Date.now()),1200)})();</script></body></html>
